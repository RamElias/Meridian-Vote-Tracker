services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: src/Meridian.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Meridian: Host=postgres;Port=5432;Database=meridian;Username=meridian;Password=${POSTGRES_PASSWORD}
      Seed__MemberStatesPath: /seed/member_states.csv
      Storage__LocalPath: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - ../Assignment-DotNet/member_states.csv:/seed/member_states.csv:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: src/Meridian.Worker/Dockerfile
    environment:
      ConnectionStrings__Meridian: Host=postgres;Port=5432;Database=meridian;Username=meridian;Password=${POSTGRES_PASSWORD}
      Seed__MemberStatesPath: /seed/member_states.csv
      Storage__LocalPath: /app/uploads
    volumes:
      - ../Assignment-DotNet/member_states.csv:/seed/member_states.csv:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: src/Meridian.Web/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started
volumes:
  postgres_data:
  uploads:
