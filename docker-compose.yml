services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: src/Meridian.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Azure__KeyVault__VaultUri: ${AZURE_KEY_VAULT_URI:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      ConnectionStrings__Meridian: ${MERIDIAN_CONNECTION_STRING:-Host=postgres;Port=5432;Database=meridian;Username=meridian;Password=${POSTGRES_PASSWORD}}
      Seed__MemberStatesPath: /seed/member_states.csv
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__LocalPath: /app/uploads
      Storage__AzureBlob__ServiceUri: ${AZURE_BLOB_SERVICE_URI:-}
      Storage__AzureBlob__Container: ${AZURE_BLOB_CONTAINER:-meridian-imports}
      DocumentIntelligence__Endpoint: ${DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      DocumentIntelligence__ApiKey: ${DOCUMENT_INTELLIGENCE_API_KEY:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "8080:8080"
    volumes:
      - ../Assignment-DotNet/member_states.csv:/seed/member_states.csv:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: src/Meridian.Worker/Dockerfile
    environment:
      Azure__KeyVault__VaultUri: ${AZURE_KEY_VAULT_URI:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      ConnectionStrings__Meridian: ${MERIDIAN_CONNECTION_STRING:-Host=postgres;Port=5432;Database=meridian;Username=meridian;Password=${POSTGRES_PASSWORD}}
      Seed__MemberStatesPath: /seed/member_states.csv
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__LocalPath: /app/uploads
      Storage__AzureBlob__ServiceUri: ${AZURE_BLOB_SERVICE_URI:-}
      Storage__AzureBlob__Container: ${AZURE_BLOB_CONTAINER:-meridian-imports}
      DocumentIntelligence__Endpoint: ${DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      DocumentIntelligence__ApiKey: ${DOCUMENT_INTELLIGENCE_API_KEY:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    volumes:
      - ../Assignment-DotNet/member_states.csv:/seed/member_states.csv:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: src/Meridian.Web/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started
volumes:
  postgres_data:
  uploads:
